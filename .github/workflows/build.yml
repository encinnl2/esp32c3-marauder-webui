name: Build ESP32-C3 Marauder Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python and pip
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip

      - name: Install PlatformIO
        run: |
          source .venv/bin/activate
          pip install platformio

      - name: Move firmware files to project root
        run: |
          mv esp32c3_marauder_webui/* .
          mv esp32c3_marauder_webui/.* . 2>/dev/null || true
          rm -rf esp32c3_marauder_webui

      - name: Compile firmware for ESP32-C3
        run: |
          source .venv/bin/activate
          pio run -e esp32c3

      - name: Locate generated binary
        run: |
          ls -lah .pio/build/esp32c3/

      - name: Rename binary for easier access
        run: |
          if [ -f ".pio/build/esp32c3/firmware.bin" ]; then
            cp .pio/build/esp32c3/firmware.bin firmware-esp32c3-marauder.bin
            echo "Binary ready: firmware-esp32c3-marauder.bin"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-marauder-firmware
          path: firmware-esp32c3-marauder.bin
          if-no-files-found: error