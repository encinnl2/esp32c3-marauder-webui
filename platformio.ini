; PlatformIO Project Configuration File
;
; Build ESP32-C3 Marauder firmware
;   platformio run -e esp32c3
;

[platformio]
src_dir = .

[env:esp32c3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Optimize for ESP32-C3 small flash
build_flags =
    -DESP32_C3
    -DHAS_BT
    -DCORE_DEBUG_LEVEL=0
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Partition table: minimal spiffs
board_build.partitions = min_spiffs.csv

; Upload speed
upload_speed = 921600

; Library dependencies
lib_deps =
    esphome/ESPAsyncWebServer-esphome@2.2.0
    esphome/AsyncTCP-esphome@1.2.0
    bblanchon/ArduinoJson@6.21.0
    h2zero/NimBLE-Arduino@1.4.0

[env:esp32c3-ota]
extends = env:esp32c3
upload_protocol = espota